<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Napirend" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2D6A4F" />
<title>Napirend</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --text: #1A1916;
  --muted: #888780;
  --border: #E2E0D8;
  --accent: #2D6A4F;
  --accent-light: #E8F5EE;
  --accent-text: #1B4332;
  --danger: #C0392B;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html { height: 100%; background: var(--accent); }

body {
  font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

header {
  background: var(--accent);
  padding: calc(var(--safe-top) + 14px) 16px 14px;
  flex-shrink: 0;
}

.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.nav-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}

.nav-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.92); }

.nav-center { flex: 1; text-align: center; }

.header-date {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  font-weight: 500;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}

.header-title {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}

.header-title.today-mark::after {
  content: ' •';
  color: rgba(255,255,255,0.5);
  font-size: 14px;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress-bar-wrap {
  flex: 1;
  height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: rgba(255,255,255,0.85);
  border-radius: 4px;
  transition: width 0.4s ease;
}

.progress-badge {
  background: rgba(255,255,255,0.18);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}

.today-btn {
  background: rgba(255,255,255,0.18);
  border: none;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.03em;
  transition: background 0.15s;
}

.today-btn:active { background: rgba(255,255,255,0.35); }

.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

main {
  padding: 10px 14px 16px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 18px 0 8px 4px;
}

.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.25s, transform 0.12s;
}

.task-card.done { opacity: 0.45; }
.task-card:active { transform: scale(0.97); }

.checkbox {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.task-card.done .checkbox {
  background: var(--accent);
  border-color: var(--accent);
}

.check-icon { display: none; }
.task-card.done .check-icon { display: block; }

.task-info { flex: 1; min-width: 0; }

.task-time {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 2px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.task-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-card.done .task-text {
  text-decoration: line-through;
  color: var(--muted);
}

.task-del {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  color: #ccc;
  font-size: 20px;
  cursor: pointer;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}

.task-del:active { background: #FEE2E2; color: var(--danger); }

.empty {
  text-align: center;
  padding: 50px 0 30px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
}

.copy-btn {
  margin-top: 14px;
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent-text);
  border: none;
  border-radius: var(--radius-sm);
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}

.copy-btn:active { background: #c8eedd; }

.bottom-bar {
  flex-shrink: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 14px calc(12px + var(--safe-bottom));
}

.add-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.add-row input[type="text"] {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-size: 15px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  min-width: 0;
  -webkit-appearance: none;
}

.add-row input[type="text"]:focus { border-color: var(--accent); }

.add-row input[type="time"] {
  width: 90px;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 8px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
}

.btn-add {
  width: 46px;
  flex-shrink: 0;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.btn-add:active { background: var(--accent-text); transform: scale(0.95); }

.action-row { display: flex; gap: 8px; }

.btn-action {
  flex: 1;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  padding: 9px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}

.btn-action:active { background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <button class="nav-btn" onclick="changeDay(-1)">&#8249;</button>
    <div class="nav-center">
      <div class="header-date" id="date-label"></div>
      <div class="header-title" id="day-title"></div>
    </div>
    <button class="nav-btn" onclick="changeDay(1)">&#8250;</button>
  </div>
  <div class="progress-row">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-badge" id="progress-badge">0 / 0</div>
    <button class="today-btn" onclick="goToday()">Ma</button>
  </div>
</header>

<div class="scroll-area">
  <main id="main-list"></main>
</div>

<div class="bottom-bar">
  <div class="add-row">
    <input type="text" id="new-text" placeholder="Új feladat..." />
    <input type="time" id="new-time" value="09:00" />
    <button class="btn-add" onclick="addTask()">+</button>
  </div>
  <div class="action-row">
    <button class="btn-action" onclick="clearDone()">✓ Kész törlése</button>
    <button class="btn-action" onclick="copyFromPrev()">⬅ Tegnap másolása</button>
  </div>
</div>

<script>
// Dátum kulcs: YYYY-MM-DD
function dateKey(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(key) {
  const d = keyToDate(key);
  const days = ['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
  const months = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
  return {
    day: days[d.getDay()],
    full: d.getFullYear() + '. ' + months[d.getMonth()] + ' ' + d.getDate() + '.'
  };
}

let currentOffset = 0;
let nextId = 1;

function currentKey() { return dateKey(currentOffset); }

function loadAll() {
  try { return JSON.parse(localStorage.getItem('napirend_days') || '{}'); } catch(e) { return {}; }
}

function saveAll(data) {
  try { localStorage.setItem('napirend_days', JSON.stringify(data)); } catch(e) {}
}

function getTasks(key) {
  const data = loadAll();
  return data[key] ? data[key] : [];
}

function setTasks(key, tasks) {
  const data = loadAll();
  data[key] = tasks;
  saveAll(data);
}

function getNextId() {
  try {
    const n = parseInt(localStorage.getItem('napirend_nextid') || '1');
    localStorage.setItem('napirend_nextid', n + 1);
    return n;
  } catch(e) { return Date.now(); }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const key = currentKey();
  const tasks = getTasks(key);
  const sorted = [...tasks].sort((a,b) => a.time.localeCompare(b.time));
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const todayKey = dateKey(0);
  const fmt = formatDate(key);

  document.getElementById('date-label').textContent = fmt.full;
  const titleEl = document.getElementById('day-title');
  titleEl.textContent = fmt.day + (key === todayKey ? ' ·  Ma' : '');

  document.getElementById('progress-badge').textContent = done + ' / ' + total;
  document.getElementById('progress-bar').style.width = pct + '%';

  const container = document.getElementById('main-list');

  if (!tasks.length) {
    const prevKey = dateKey(currentOffset - 1);
    const prevTasks = getTasks(prevKey);
    container.innerHTML = `<div class="empty">Ezen a napon nincs feladat 📋<br>Adj hozzá egyet!${prevTasks.length ? '<br><button class="copy-btn" onclick="copyFromPrev()">⬅ Másolom tegnap feladatait</button>' : ''}</div>`;
    return;
  }

  container.innerHTML = '';
  let lastGroup = null;

  sorted.forEach(task => {
    const h = parseInt(task.time.split(':')[0]);
    const group = h < 12 ? '🌅 Délelőtt' : h < 17 ? '☀️ Délután' : '🌙 Este';

    if (group !== lastGroup) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = group;
      container.appendChild(lbl);
      lastGroup = group;
    }

    const card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' done' : '');
    card.innerHTML = `
      <div class="checkbox">
        <svg class="check-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2.5 6.5L5.5 9.5L10.5 3.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-info">
        <div class="task-time">${task.time}</div>
        <div class="task-text">${esc(task.text)}</div>
      </div>
      <button class="task-del" aria-label="Törlés">×</button>`;

    card.querySelector('.task-del').addEventListener('click', e => {
      e.stopPropagation();
      card.style.opacity = '0';
      card.style.transform = 'scale(0.95)';
      setTimeout(() => {
        const tasks2 = getTasks(key).filter(t => t.id !== task.id);
        setTasks(key, tasks2);
        render();
      }, 180);
    });

    card.addEventListener('click', () => {
      const tasks2 = getTasks(key).map(t => t.id === task.id ? {...t, done: !t.done} : t);
      setTasks(key, tasks2);
      render();
    });

    container.appendChild(card);
  });
}

function changeDay(dir) {
  currentOffset += dir;
  document.getElementById('scroll-area') && (document.querySelector('.scroll-area').scrollTop = 0);
  render();
}

function goToday() {
  currentOffset = 0;
  render();
}

function addTask() {
  const textEl = document.getElementById('new-text');
  const timeEl = document.getElementById('new-time');
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); return; }
  const key = currentKey();
  const tasks = getTasks(key);
  tasks.push({ id: getNextId(), time: timeEl.value || '09:00', text, done: false });
  setTasks(key, tasks);
  textEl.value = '';
  render();
  textEl.focus();
}

function clearDone() {
  const key = currentKey();
  setTasks(key, getTasks(key).filter(t => !t.done));
  render();
}

function copyFromPrev() {
  const prevKey = dateKey(currentOffset - 1);
  const prevTasks = getTasks(prevKey);
  if (!prevTasks.length) { alert('Az előző napnak nincsenek feladatai.'); return; }
  const key = currentKey();
  const existing = getTasks(key);
  const copied = prevTasks.map(t => ({ ...t, id: getNextId(), done: false }));
  setTasks(key, [...existing, ...copied]);
  render();
}

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 60) changeDay(diff > 0 ? 1 : -1);
}, { passive: true });

document.getElementById('new-text').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// Service Worker
if ('serviceWorker' in navigator) {
  const sw = `const C='napirend-v2';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response(''))));`;
  const blob = new Blob([sw], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

render();
</script>
</body>
</html>
