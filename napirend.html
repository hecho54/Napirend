<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Napirend" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2D6A4F" />
<title>Napirend</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --text: #1A1916;
  --muted: #888780;
  --border: #E2E0D8;
  --accent: #2D6A4F;
  --accent-light: #E8F5EE;
  --accent-text: #1B4332;
  --danger: #C0392B;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html { height: 100%; background: var(--accent); }

body {
  font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

header {
  background: var(--accent);
  padding: calc(var(--safe-top) + 18px) 20px 18px;
  flex-shrink: 0;
}

.header-date {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 4px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-title {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
}

.progress-badge {
  background: rgba(255,255,255,0.18);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 5px 13px;
  border-radius: 20px;
}

.progress-bar-wrap {
  margin-top: 14px;
  height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: rgba(255,255,255,0.9);
  border-radius: 4px;
  transition: width 0.4s ease;
}

#install-banner {
  display: none;
  background: var(--accent-light);
  border-bottom: 1px solid #b7dfc9;
  padding: 10px 16px;
  flex-shrink: 0;
  align-items: center;
  gap: 10px;
}

#install-banner span { flex: 1; font-size: 13px; color: var(--accent-text); font-weight: 500; }

.btn-install {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.btn-dismiss {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  padding: 4px 6px;
  line-height: 1;
}

.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

main {
  padding: 10px 14px 16px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 18px 0 8px 4px;
}

.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.25s, transform 0.12s;
}

.task-card.done { opacity: 0.45; }
.task-card:active { transform: scale(0.97); }

.checkbox {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.task-card.done .checkbox {
  background: var(--accent);
  border-color: var(--accent);
}

.check-icon { display: none; }
.task-card.done .check-icon { display: block; }

.task-info { flex: 1; min-width: 0; }

.task-time {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 2px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.task-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-card.done .task-text {
  text-decoration: line-through;
  color: var(--muted);
}

.task-del {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  color: #ccc;
  font-size: 20px;
  cursor: pointer;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}

.task-del:active { background: #FEE2E2; color: var(--danger); }

.empty {
  text-align: center;
  padding: 60px 0 40px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.8;
}

.bottom-bar {
  flex-shrink: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 14px calc(12px + var(--safe-bottom));
}

.add-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.add-row input[type="text"] {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-size: 15px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  min-width: 0;
  -webkit-appearance: none;
}

.add-row input[type="text"]:focus { border-color: var(--accent); }

.add-row input[type="time"] {
  width: 90px;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 8px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
}

.btn-add {
  width: 46px;
  flex-shrink: 0;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.btn-add:active { background: var(--accent-text); transform: scale(0.95); }

.action-row { display: flex; gap: 8px; }

.btn-action {
  flex: 1;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  padding: 9px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}

.btn-action:active { background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="header-date" id="date-label"></div>
  <div class="header-row">
    <div class="header-title">Napirend</div>
    <div class="progress-badge" id="progress-badge">0 / 0</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
</header>

<div id="install-banner">
  <span>📲 Telepítsd főképernyőre!</span>
  <button class="btn-install" id="btn-install">Telepítés</button>
  <button class="btn-dismiss" id="btn-dismiss">×</button>
</div>

<div class="scroll-area">
  <main id="main-list"></main>
</div>

<div class="bottom-bar">
  <div class="add-row">
    <input type="text" id="new-text" placeholder="Új feladat..." />
    <input type="time" id="new-time" value="09:00" />
    <button class="btn-add" onclick="addTask()">+</button>
  </div>
  <div class="action-row">
    <button class="btn-action" onclick="clearDone()">✓ Kész törlése</button>
    <button class="btn-action" onclick="resetAll()">↺ Visszaállítás</button>
  </div>
</div>

<script>
const DEFAULTS = [
  {id:1,time:"07:00",text:"Ébredés & reggeli rutin",done:false},
  {id:2,time:"08:00",text:"Reggeli",done:false},
  {id:3,time:"09:00",text:"Legfontosabb feladat",done:false},
  {id:4,time:"11:00",text:"E-mailek & üzenetek",done:false},
  {id:5,time:"12:30",text:"Ebéd & pihenő",done:false},
  {id:6,time:"14:00",text:"Megbeszélés / projekt",done:false},
  {id:7,time:"16:00",text:"Adminisztráció",done:false},
  {id:8,time:"18:00",text:"Mozgás / sport",done:false},
  {id:9,time:"20:00",text:"Vacsora & lezárás",done:false},
];

let tasks=[], nextId=10;

function load(){
  try{
    const s=localStorage.getItem('napirend_v3');
    if(s){const d=JSON.parse(s);tasks=d.tasks;nextId=d.nextId||10;}
    else tasks=DEFAULTS.map(t=>({...t}));
  }catch(e){tasks=DEFAULTS.map(t=>({...t}));}
}

function save(){
  try{localStorage.setItem('napirend_v3',JSON.stringify({tasks,nextId}));}catch(e){}
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const sorted=[...tasks].sort((a,b)=>a.time.localeCompare(b.time));
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progress-badge').textContent=done+' / '+total;
  document.getElementById('progress-bar').style.width=pct+'%';
  const container=document.getElementById('main-list');
  if(!tasks.length){container.innerHTML='<div class="empty">Nincs feladat 🌱<br>Adj hozzá egyet!</div>';return;}
  container.innerHTML='';
  let lastGroup=null;
  sorted.forEach(task=>{
    const h=parseInt(task.time.split(':')[0]);
    const group=h<12?'🌅 Délelőtt':h<17?'☀️ Délután':'🌙 Este';
    if(group!==lastGroup){
      const lbl=document.createElement('div');
      lbl.className='section-label';
      lbl.textContent=group;
      container.appendChild(lbl);
      lastGroup=group;
    }
    const card=document.createElement('div');
    card.className='task-card'+(task.done?' done':'');
    card.innerHTML=`
      <div class="checkbox">
        <svg class="check-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2.5 6.5L5.5 9.5L10.5 3.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-info">
        <div class="task-time">${task.time}</div>
        <div class="task-text">${esc(task.text)}</div>
      </div>
      <button class="task-del" aria-label="Törlés">×</button>`;
    card.querySelector('.task-del').addEventListener('click',e=>{
      e.stopPropagation();
      card.style.opacity='0';
      card.style.transform='scale(0.95)';
      setTimeout(()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render();},180);
    });
    card.addEventListener('click',()=>{task.done=!task.done;save();render();});
    container.appendChild(card);
  });
}

function addTask(){
  const textEl=document.getElementById('new-text');
  const timeEl=document.getElementById('new-time');
  const text=textEl.value.trim();
  if(!text){textEl.focus();return;}
  tasks.push({id:nextId++,time:timeEl.value||'09:00',text,done:false});
  textEl.value='';
  save();render();textEl.focus();
}

function clearDone(){tasks=tasks.filter(t=>!t.done);save();render();}
function resetAll(){if(confirm('Visszaállítsuk az alapértelmezett napirendet?')){tasks=DEFAULTS.map(t=>({...t}));nextId=10;save();render();}}

document.getElementById('new-text').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

const now=new Date();
const days=['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
const months=['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
document.getElementById('date-label').textContent=days[now.getDay()]+' · '+now.getFullYear()+'. '+months[now.getMonth()]+' '+now.getDate()+'.';

// Android PWA install
let deferredPrompt=null;
const banner=document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;banner.style.display='flex';
});
document.getElementById('btn-install').addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;banner.style.display='none';
});
document.getElementById('btn-dismiss').addEventListener('click',()=>{banner.style.display='none';});
window.addEventListener('appinstalled',()=>{banner.style.display='none';});

// Service Worker a teljes offline működéshez
if('serviceWorker' in navigator){
  const sw=`const C='napirend-v1';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response(''))));`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

load();render();
</script>
</body>
</html>
